<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Me If You Can</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 35%, #3a86ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.8);
        }

        .quiz-card {
            background: rgba(20, 20, 50, 0.7);
            border: 2px solid rgba(255, 0, 110, 0.5);
            border-radius: 20px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.3), inset 0 0 40px rgba(255, 0, 110, 0.1);
        }

        .question-section {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
        }

        .question-mark {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff006e, #ffbe0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
            min-width: 80px;
            text-align: center;
        }

        .question-text {
            font-size: 28px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .question-text .highlight {
            color: #ffbe0b;
            font-style: italic;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .answer-option {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .answer-option input[type="radio"] {
            display: none;
        }

        .answer-label {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(30, 30, 60, 0.6);
            border-left: 4px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .answer-option:nth-child(1) .answer-label {
            border-left-color: #ff006e;
        }

        .answer-option:nth-child(2) .answer-label {
            border-left-color: #3a86ff;
        }

        .answer-option:nth-child(3) .answer-label {
            border-left-color: #8338ec;
        }

        .answer-option:nth-child(4) .answer-label {
            border-left-color: #ffbe0b;
        }

        .answer-option input[type="radio"]:checked + .answer-label {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .answer-option:nth-child(1) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6), inset 0 0 20px rgba(255, 0, 110, 0.2);
        }

        .answer-option:nth-child(2) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(58, 134, 255, 0.6), inset 0 0 20px rgba(58, 134, 255, 0.2);
        }

        .answer-option:nth-child(3) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(131, 56, 236, 0.6), inset 0 0 20px rgba(131, 56, 236, 0.2);
        }

        .answer-option:nth-child(4) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(255, 190, 11, 0.6), inset 0 0 20px rgba(255, 190, 11, 0.2);
        }

        .answer-label:hover {
            transform: translateX(3px);
            background: rgba(255, 255, 255, 0.08);
        }

        .answer-letter {
            font-weight: 900;
            font-size: 18px;
            min-width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
        }

        .answer-option:nth-child(1) .answer-letter {
            background: rgba(255, 0, 110, 0.3);
            color: #ff006e;
        }

        .answer-option:nth-child(2) .answer-letter {
            background: rgba(58, 134, 255, 0.3);
            color: #3a86ff;
        }

        .answer-option:nth-child(3) .answer-letter {
            background: rgba(131, 56, 236, 0.3);
            color: #8338ec;
        }

        .answer-option:nth-child(4) .answer-letter {
            background: rgba(255, 190, 11, 0.3);
            color: #ffbe0b;
        }

        /* Off-road vehicle option styling */
        .answer-option:nth-child(5) .answer-label {
            border-left-color: #06ffa5;
        }

        .answer-option:nth-child(5) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(6, 255, 165, 0.6),
                        inset 0 0 20px rgba(6, 255, 165, 0.2);
        }

        .answer-option:nth-child(5) .answer-letter {
            background: rgba(6, 255, 165, 0.3);
            color: #06ffa5;
        }

        .answer-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .answer-subtext {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        /* Soviet car option styling */
        .answer-option:nth-child(6) .answer-label {
            border-left-color: #ff0040;
        }

        .answer-option:nth-child(6) input[type="radio"]:checked + .answer-label {
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.6),
                        inset 0 0 20px rgba(255, 0, 64, 0.2);
        }

        .answer-option:nth-child(6) .answer-letter {
            background: rgba(255, 0, 64, 0.3);
            color: #ff0040;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            border: 2px solid rgba(255, 0, 110, 0.6);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6), 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .quiz-card {
                padding: 40px 25px;
            }

            .question-section {
                gap: 20px;
                margin-bottom: 35px;
            }

            .question-mark {
                font-size: 60px;
                min-width: 60px;
            }

            .question-text {
                font-size: 22px;
            }

            .answers-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }


            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">WOTECH</div>
        </div>

        <div class="quiz-card">
            <form id="quizForm">
                <div class="question-section">
                    <div class="question-mark">?</div>
                    <div class="question-text">
                        What <span class="highlight">car</span> are you?
                    </div>
                </div>

                <div class="answers-grid">
                    <div class="answer-option">
                        <input type="radio" id="option-a" name="car" value="porsche911" required>
                        <label for="option-a" class="answer-label">
                            <span class="answer-letter">A</span>
                            <div>
                                <span class="answer-text">Porsche 911</span>
                                <div class="answer-subtext">Fast & Thrilling</div>
                            </div>
                        </label>
                    </div>

                    <div class="answer-option">
                        <input type="radio" id="option-b" name="car" value="volvo-xc90">
                        <label for="option-b" class="answer-label">
                            <span class="answer-letter">B</span>
                            <div>
                                <span class="answer-text">Volvo XC90</span>
                                <div class="answer-subtext">Safe & Reliable</div>
                            </div>
                        </label>
                    </div>

                    <div class="answer-option">
                        <input type="radio" id="option-c" name="car" value="horse">
                        <label for="option-c" class="answer-label">
                            <span class="answer-letter">C</span>
                            <div>
                                <span class="answer-text">Horse</span>
                                <div class="answer-subtext">Classic & Free</div>
                            </div>
                        </label>
                    </div>

                    <div class="answer-option">
                        <input type="radio" id="option-d" name="car" value="cybertruck">
                        <label for="option-d" class="answer-label">
                            <span class="answer-letter">D</span>
                            <div>
                                <span class="answer-text">Cybertruck</span>
                                <div class="answer-subtext">Futuristic & Bold</div>
                            </div>
                        </label>
                    </div>

                    <div class="answer-option">
                        <input type="radio" id="option-e" name="car" value="jeep-wrangler">
                        <label for="option-e" class="answer-label">
                            <span class="answer-letter">E</span>
                            <div>
                                <span class="answer-text">Jeep Wrangler</span>
                                <div class="answer-subtext">Adventure & Tough</div>
                            </div>
                        </label>
                    </div>

                    <div class="answer-option">
                        <input type="radio" id="option-f" name="car" value="lada">
                        <label for="option-f" class="answer-label">
                            <span class="answer-letter">F</span>
                            <div>
                                <span class="answer-text">Lada 2105</span>
                                <div class="answer-subtext">Retro Soviet Legend</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit Answer</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('quizForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const selected = document.querySelector('input[name="car"]:checked');
            if (selected) {
                alert(`You selected: ${selected.nextElementSibling.textContent}`);
            }
        });
    </script>
</body>
</html>
